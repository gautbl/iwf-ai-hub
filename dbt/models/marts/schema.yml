version: 2

models:
  - name: stg_results
    description: "Staging view: cleans and types raw OpenWeightlifting data (Silver layer)."
    columns:
      - name: event_id
        description: "Identifier of the source event (from the CSV filename)."
      - name: event_name
        description: "Human readable event name from the CSV."
      - name: athlete_name
        description: "Trimmed athlete name."
      - name: event_date
        description: "Competition date (DATE)."
      - name: category_name
        description: "Trimmed weight category."
      - name: snatch_total
        description: "Best snatch weight (DOUBLE)."
      - name: clean_jerk_total
        description: "Best clean & jerk weight (DOUBLE)."
      - name: combined_total
        description: "Combined total weight (DOUBLE)."

  - name: dim_athletes
    description: "Dimension table of athletes (Gold layer)."
    columns:
      - name: athlete_id
        description: "Primary key for the athlete"
        tests:
          - unique
          - not_null
      - name: name
        description: "Athlete name"
        tests:
          - not_null
      - name: country
        description: "Athlete country"

  - name: dim_weight_classes
    description: "Dimension table of weight classes (Gold layer)."
    columns:
      - name: class_id
        description: "Primary key for the weight class"
        tests:
          - unique
          - not_null
      - name: category_name
        description: "Weight class name"
        tests:
          - not_null

  - name: fct_results
    description: "Fact table containing Olympic lifting results linked to athletes and categories."
    columns:
      - name: result_id
        description: "Primary key for the result"
        tests:
          - unique
          - not_null

      - name: athlete_id
        description: "Foreign key linking to the athletes dimension"
        tests:
          - not_null
          - relationships:
              to: ref('dim_athletes')
              field: athlete_id

      - name: class_id
        description: "Foreign key linking to the weight class dimension"
        tests:
          - not_null
          - relationships:
              to: ref('dim_weight_classes')
              field: class_id
