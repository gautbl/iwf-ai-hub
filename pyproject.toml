[project]
name = "iwf-ai-hub"
version = "0.1.0"
description = "Plateforme d'intelligence augmentée pour l'IWF"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Core / ETL (Phase 2)
    "duckdb>=1.0",
    "pandas>=2.1",
    "requests>=2.31",

    # RAG (Phase 3)
    "pypdf>=4.0",

    # Logging
    "structlog>=24.0",

    # API & Agent (Phase 4-5)
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "langgraph>=1.0",
    "langgraph-checkpoint-duckdb>=2.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "ollama>=0.3",
]

[project.optional-dependencies]
airflow = [
    "apache-airflow==2.7.1",
    "apache-airflow-providers-http>=4.0.0",
    "dbt-core==1.7.0",
    "dbt-duckdb==1.7.0",
]

dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "reportlab>=4.0",
    "certifi>=2024.0",
]

all = [
    "iwf-ai-hub[airflow,dev]",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "B017",  # assertRaises(Exception) — toléré dans les tests
    "UP007",  # X | Y plutôt que Union/Optional — Python 3.11 OK
    "E501",  # line-too-long: docstrings français et chaînes SQL longues
    "E402",  # module-import-not-at-top: imports conditionnels dans les tests
    "B008",  # do-not-call-function-in-default: Depends() de FastAPI
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
exclude = [
    ".venv/",
    "build/",
    "data/",
    ".scratch/",
]

[[tool.mypy.overrides]]
module = [
    "duckdb",
    "structlog",
    "langchain_core.*",
    "langchain_ollama.*",
    "langgraph.*",
    "fastapi.*",
    "pydantic.*",
    "pydantic_settings.*",
    "requests.*",
    "starlette.*",
    "pypdf.*",
    "pandas.*",
    "ormsgpack.*",
    "reportlab.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "src.pipelines.retrieval",
    "src.agent.tools",
    "src.api.main",
]
no_strict_optional = true

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # error d'abord (LIFO : ajouté premier → vérifié en dernier) ;
    'error',
    # puis les ignores spécifiques pour les avertissements amont (vérifiés avant error).
    'ignore::PendingDeprecationWarning:langgraph',
    'ignore::DeprecationWarning:starlette.testclient',
]
