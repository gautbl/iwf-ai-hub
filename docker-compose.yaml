version: '3.8'

services:
  # Base de données et stockage via DuckDB (géré par les volumes)
  # DuckDB étant un fichier local, on expose un volume pour la persistance
  db_storage:
    image: alpine
    volumes:
      - ./data:/data
    command: tail -f /dev/null

  # LLM local pour le raisonnement et les embeddings
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Orchestrateur de données (Airflow)
  # Note : Pour un dev local léger, on pourrait utiliser un simple script 
  # mais Airflow est préférable pour démontrer vos compétences Data Eng.
  airflow:
    build:
      dockerfile: Dockerfile.airflow
    command: standalone
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - DBT_PROFILES_DIR=/opt/airflow/dbt # Added so dbt finds profiles.yml
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./dbt:/opt/airflow/dbt # Added so dbt has access to models and profiles.yml
      - ./data:/data           # Added so dbt can write to the DuckDB file
      - huggingface_cache:/home/airflow/.cache
    depends_on:
      - ollama

  # API FastAgent pour l'interface de chat
  api:
    build:
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./data/duckdb:/data/duckdb
    environment:
      - IWF_DUCKDB_PATH=data/duckdb/iwf_hub.duckdb
      - IWF_OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
  huggingface_cache:
