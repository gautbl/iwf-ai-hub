# Secret réservé aux valeurs sensibles (credentials API, tokens internes,
# clés de chiffrement des embeddings, etc.).
#
# À ce jour, l'API IWF n'utilise **aucun** credential distant :
#   - Ollama est local (réseau interne cluster),
#   - DuckDB est local (PVC monté),
#   - les LLM calls restent en local.
#
# Ce manifest est un **placeholder documenté** : l'opérateur cluster doit
# ajouter des clés via :
#
#   kubectl create secret generic iwf-api-secret \
#     -n iwf-ai-hub \
#     --from-literal=KEY=value
#
# …ou via le chart Helm (étape 6) qui exposera ``values.secret.*``.
---
apiVersion: v1
kind: Secret
metadata:
  name: iwf-api-secret
  namespace: iwf-ai-hub
  labels:
    app.kubernetes.io/name: iwf-api
    app.kubernetes.io/part-of: iwf-ai-hub
    app.kubernetes.io/component: api
type: Opaque
stringData: {}
