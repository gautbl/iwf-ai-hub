# ServiceAccount minimal pour les pods de l'API FastAPI (Phase 5).
# L'API n'a pas besoin d'accéder à l'API Kubernetes ; le token n'est
# donc **pas** monté automatiquement (`automountServiceAccountToken: false`).
# Les pods Ollama et DuckDB utiliseront leur propre SA (étapes ultérieures).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iwf-api
  namespace: iwf-ai-hub
  labels:
    app.kubernetes.io/name: iwf-api
    app.kubernetes.io/part-of: iwf-ai-hub
    app.kubernetes.io/component: api
automountServiceAccountToken: false
imagePullSecrets:
  # TODO(step-6): le secret `regcred` doit être créé par l'équipe infra
  # (ex : `kubectl create secret docker-registry regcred ...`) avant le
  # premier déploiement. Sera rendu paramétrable via values.yaml dans
  # le chart Helm.
  - name: regcred
